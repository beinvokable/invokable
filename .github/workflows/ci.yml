name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads `packageManager` from
      # package.json, and specifying both makes it fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke-test the example tool
        run: |
          set -euo pipefail
          out=$(node examples/demo-tool/bin/demo-tool.mjs greet --name ci --json 2>/dev/null)
          echo "$out" | jq -e '.status == "ok"' > /dev/null
          test "$(echo "$out" | wc -l)" -eq 1

          set +e
          node examples/demo-tool/bin/demo-tool.mjs find-project nope --json >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 5 || { echo "expected exit 5, got $code"; exit 1; }

      - name: The example tool honours its own contract
        run: node packages/conformance/bin/invokable-test.mjs node examples/demo-tool/bin/demo-tool.mjs

      - name: The MCP adapter exposes the CLI's real surface
        run: node examples/mcp/ci-check.mjs

      - name: Generated agent instructions are up to date
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/skills-check"
          mkdir -p "$out"
          node examples/demo-tool/bin/demo-tool.mjs init --dir "$out" >/dev/null 2>&1
          # A second run must be a no-op; if it is not, generation is not deterministic.
          node examples/demo-tool/bin/demo-tool.mjs init --dir "$out" --check >/dev/null 2>&1

          # The same SKILL.md must reach every agent's directory, byte for byte.
          hashes=$(md5sum \
            "$out"/.claude/skills/demo-tool/SKILL.md \
            "$out"/.codex/skills/demo-tool/SKILL.md \
            "$out"/.cursor/skills/demo-tool/SKILL.md \
            "$out"/.gemini/skills/demo-tool/SKILL.md \
            "$out"/.agents/skills/demo-tool/SKILL.md | awk '{print $1}' | sort -u | wc -l)
          test "$hashes" -eq 1 || { echo "SKILL.md differs between agent directories"; exit 1; }

      - name: Smoke-test self-hosted auth end to end
        run: |
          set -euo pipefail
          node examples/server/server.mjs & srv=$!
          trap 'kill $srv 2>/dev/null || true' EXIT
          sleep 2

          export DEMO_TOOL_API=http://127.0.0.1:8787
          export DEMO_TOOL_CONFIG_DIR="$RUNNER_TEMP/demo-cfg"

          node examples/demo-tool/bin/demo-tool.mjs login --json \
            >"$RUNNER_TEMP/login.out" 2>"$RUNNER_TEMP/login.err" & login=$!
          sleep 2
          code=$(grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}' "$RUNNER_TEMP/login.err" | head -1)
          test -n "$code" || { echo "no user code printed"; cat "$RUNNER_TEMP/login.err"; exit 1; }
          curl -sf -X POST http://127.0.0.1:8787/device/approve \
            -H 'content-type: application/json' -d "{\"userCode\":\"$code\"}" >/dev/null
          wait $login

          jq -e '.data.signedIn == true' "$RUNNER_TEMP/login.out" >/dev/null
          node examples/demo-tool/bin/demo-tool.mjs whoami --json 2>/dev/null \
            | jq -e '.data.subject == "demo@example.com"' >/dev/null

          # The stored credential must not be world-readable.
          perms=$(stat -c '%a' "$DEMO_TOOL_CONFIG_DIR/config.json")
          test "$perms" = "600" || { echo "config.json is $perms, expected 600"; exit 1; }
